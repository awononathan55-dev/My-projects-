<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="container">
    <div class="container-top">
      <div class="weather-search">
        <input type="text" class="search-bar" placeholder="Enter a city...">
        <span onclick="weather.fetchWeather(document.querySelector('.search-bar').value)">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
            <path fill="currentColor" 
            d="M9.5 16q-2.725 0-4.612-1.888T3 9.5t1.888-4.612T9.5 3t4.613 1.888T16 9.5q0 1.1-.35 2.075T14.7 13.3l5.6 5.6q.275.275.275.7t-.275.7t-.7.275t-.7-.275l-5.6-5.6q-.75.6-1.725.95T9.5 16m0-2q1.875 0 3.188-1.312T14 9.5t-1.312-3.187T9.5 5T6.313 6.313T5 9.5t1.313 3.188T9.5 14"/>
          </svg>
        </span>
      </div>
      <div class="weather-bar">
        <div class="weather-stat">
          <h2 class="temperature"></h2>
          <p class="City"></p>
          <p class="description"></p>
          
        </div>
        <div class="weather-icon">
          <img style="transform: scale(1.5);" class="icon" src="" alt="Weather Icon">
        </div>
      </div>
    </div>

    <div class="container-stat">
      <div class="stat-card">
        <small>Wind Status</small>
        <p class="wind-status"></p>km/h
      </div>
      <div class="stat-card">
        <small>Humidity</small>
        <p class="humidity"></p>%
      </div>
      <div class="stat-card">
        <small>Air Quality</small>
        <p class="air-quality"></p>.
      </div>
      <div class="stat-card">
        <small>Visibility</small>
        <p class="visibility"></p>Km
      </div>
    </div>
  </div>
  <script src="./js/app.js"></script>
</body>
</html>
